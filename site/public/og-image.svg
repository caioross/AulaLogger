<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="0.4" stop-color="#818cf8"/>
      <stop offset="0.75" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="square" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- logo -->
  <rect x="90" y="86" width="92" height="92" rx="24" fill="url(#square)"/>
  <g transform="translate(116,108)" stroke="#ffffff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 2a5 5 0 0 0-5 5v11a5 5 0 0 0 10 0V7a5 5 0 0 0-5-5z"/>
    <path d="M32 16v2a12 12 0 0 1-24 0v-2"/>
    <line x1="20" y1="30" x2="20" y2="38"/>
  </g>
  <text x="205" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">AulaLogger</text>

  <!-- headline -->
  <text x="90" y="312" font-family="'Segoe UI', Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Grave, transcreva e analise</text>
  <text x="90" y="392" font-family="'Segoe UI', Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5"><tspan fill="#ffffff">suas aulas —</tspan><tspan fill="url(#brand)" dx="20">sem nuvem.</tspan></text>

  <!-- subhead -->
  <text x="92" y="452" font-family="'Segoe UI', Arial, sans-serif" font-size="29" font-weight="500" fill="#b9b9c6">100% no seu celular · Whisper on-device · open source</text>

  <!-- badges -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="90" y="498" width="232" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="116" y="528" fill="#d7d7e0">Sem telemetria</text>
    <rect x="338" y="498" width="196" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="364" y="528" fill="#d7d7e0">Offline-first</text>
    <rect x="550" y="498" width="150" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="576" y="528" fill="#d7d7e0">GPL-3.0</text>
  </g>

  <!-- waveform à direita -->
  <g transform="translate(908,232)">
    <rect x="0"   y="60"  width="14" height="40"  rx="7" fill="url(#bar)" fill-opacity="0.85"/>
    <rect x="26"  y="20"  width="14" height="120" rx="7" fill="url(#bar)"/>
    <rect x="52"  y="74"  width="14" height="12"  rx="6" fill="url(#bar)" fill-opacity="0.7"/>
    <rect x="78"  y="-10" width="14" height="180" rx="7" fill="url(#bar)"/>
    <rect x="104" y="44"  width="14" height="72"  rx="7" fill="url(#bar)" fill-opacity="0.9"/>
    <rect x="130" y="-30" width="14" height="220" rx="7" fill="url(#bar)"/>
    <rect x="156" y="50"  width="14" height="60"  rx="7" fill="url(#bar)" fill-opacity="0.8"/>
    <rect x="182" y="6"   width="14" height="148" rx="7" fill="url(#bar)"/>
    <rect x="208" y="64"  width="14" height="32"  rx="7" fill="url(#bar)" fill-opacity="0.75"/>
    <rect x="234" y="-4"  width="14" height="168" rx="7" fill="url(#bar)"/>
    <rect x="260" y="54"  width="14" height="52"  rx="7" fill="url(#bar)" fill-opacity="0.85"/>
  </g>

  <!-- url -->
  <text x="1110" y="566" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#7c7c8a">aulalogger.com.br</text>
</svg>
